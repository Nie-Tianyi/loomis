[package]
name = "loomis"
version = "0.1.0"
edition = "2024"
description = "Loomis — modular agent with TUI, concrete tools, and DeepSeek backend"

[[bin]]
name = "loomis"
path = "src/main.rs"

[lib]
name = "loomis"
path = "src/lib.rs"

[dependencies]
provider = { path = "../../core/provider" }
deepseek = { path = "../../core/deepseek" }
tools = { path = "../../core/tools" }
memory = { path = "../../core/memory" }
engine = { path = "../../core/engine" }
hooks = { path = "../../extensions/compact" }
subagent = { path = "../../extensions/subagent" }
observability = { path = "../../extensions/observability" }
skills = { path = "../../extensions/skills" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
pulldown-cmark = { workspace = true }
regex = { workspace = true }
sandbox = { path = "../../extensions/sandbox" }
schemars = { workspace = true }
glob = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
arboard = { workspace = true }
time = { version = "0.3", features = ["local-offset"] }

[dev-dependencies]
futures-executor = { workspace = true }
tempfile = { workspace = true }
