[package]
name = "agent-kit"
version = "0.1.0"
edition = "2024"
description = "NVIDIA OO Agents-style ergonomics mapped onto the loomis core API"

[dependencies]
provider = { path = "../../core/provider" }
tools = { path = "../../core/tools" }
engine = { path = "../../core/engine" }
memory = { path = "../../core/memory" }
tokio = { workspace = true }
# `rc` is needed for `Arc<T>: Serialize` (serde moved Rc/Arc impls
# behind the optional `rc` feature) — `#[context(dynamic)]` fields are
# typically shared via `Arc<RwLock<...>>`.
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
agent-macros = { path = "../agent-macros" }
deepseek = { path = "../../core/deepseek" }
futures-executor = { workspace = true }
futures-util = { workspace = true }
