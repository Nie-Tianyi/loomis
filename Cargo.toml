[workspace]
members = ["core/*", "extensions/*", "bins/*"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"

[workspace.dependencies]
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.0", features = ["full"] }
dotenvy = "0.15"
futures-core = "0.3"
futures-executor = "0.3"
futures-util = "0.3.32"
regex = "1"
schemars = { version = "1", features = ["derive"] }
glob = "0.3"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
pulldown-cmark = "0.13"
tempfile = "3"
toml = "1.1"
tracing = "0.1"
serde_yaml = "0.9"
arboard = "3"
time = { version = "0.3", features = ["macros", "formatting", "local-offset"] }
